name: Sync edgetunnel script
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream script
        run: curl --fail --location --silent --show-error https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js --output _worker.js
      - name: Commit when changed
        run: |
          if ! git diff --quiet -- _worker.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add _worker.js
            git commit -m 'Sync edgetunnel worker from upstream'
            git push
          fi
